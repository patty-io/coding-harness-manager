# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.reasonix/config.toml > built-in defaults.
# Fields marked user/global only are not overridden by ./reasonix.toml.
# Secrets are named via api_key_env and stored in Reasonix's global .env; never put keys here.

config_version = 7   # schema marker for diagnostics; old versions may ignore it
default_model = "anthropic-api-kimi-com/k3-256k"
language      = "en"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG
credentials_store = "auto"   # legacy compatibility; provider keys are saved in Reasonix's global .env

[ui]
theme = "dark"   # auto|dark|light; CLI colors only; REASONIX_THEME can override per run
theme_style = "aurora"   # CLI accent palette; REASONIX_THEME_STYLE can override per run
# shortcut_layout = "desktop"   # classic|desktop; compatibility setting; Shift+Tab toggles Plan, Ctrl+Y toggles YOLO
cursor_shape = "bar"   # block|underline|bar; text input cursor shape
# show_reasoning = true   # CLI: show thinking text by default; false = collapsed (toggle with Ctrl+O)
show_turn_usage = true   # CLI/TUI: show per-request token and cost receipts in the transcript

[desktop]
# language = "zh"   # desktop UI language; empty/auto = browser/OS auto-detect
layout_style = "workbench"   # desktop layout: classic|workbench|creation
theme = "dark"   # desktop only: auto|dark|light
terminal_theme = "dark"   # integrated terminal: auto|dark|light; auto follows the desktop app
# theme_style = "graphite"   # graphite|aurora|slate|carbon|nocturne|amber and legacy aliases
# external_opener = "vscode"   # desktop Open control: installed application id
close_behavior = "background"   # desktop: quit|background when the window close button is clicked
status_bar_style = "text"   # desktop: icon|text metric labels in the bottom status bar
status_bar_items = ["model", "workspace", "git_branch", "cache", "cache_avg", "session_tokens", "turn_tokens", "turn_cost", "session_turns", "context", "compact", "cost", "balance"]   # desktop: ordered visible bottom status bar items
default_tool_approval_mode = "yolo"   # desktop: Ask/Auto/YOLO default for newly-created sessions
check_updates = true   # desktop: check for new versions on startup
telemetry = true   # desktop: anonymous launch ping + scrubbed next-launch native crash diagnostics; never content
metrics = true   # desktop: aggregate quality/lifecycle metrics (anonymous signal/bucket counts); never content
provider_access = ["custom-api-cline-bot", "custom-opencode-ai", "anthropic-api-kimi-com", "zai-glm-direct", "minimax-global-anthropic", "yolo-auto"]   # desktop settings: providers shown on Settings > Model > Access
expand_thinking = false   # desktop: legacy reasoning display alias; use reasoning_display_mode
display_mode = "standard"   # desktop: standard|compact transcript display mode

[billing]
# display_currency = "auto"   # auto|CNY|USD; display only — does not rewrite provider list prices

[telemetry]
cli_metrics = "off"   # CLI content-free usage metrics: auto|on|off; auto requires a local interactive terminal

[notifications]
enabled = false   # system notifications for CLI and desktop turns; default off
turn_done = true   # notify when a turn finishes
approval_request = true   # notify when a tool approval is waiting
ask_request = true   # notify when a question is waiting

[network]
proxy_mode = "auto"   # auto|env|custom|off; auto currently uses env proxy
# proxy_url  = "socks5://127.0.0.1:7890"   # optional custom override
# no_proxy   = "localhost,127.0.0.1,.local"   # honored for proxy_mode = "custom"

[network.proxy]
type = "socks5"   # http|https|socks5|socks5h
# server = "127.0.0.1"
# port = 7890
# username = ""
# password = "${REASONIX_PROXY_PASSWORD}"   # optional; supports ${VAR} expansion

[environment]
enabled = true   # inject a stable startup environment summary into the model prompt
offline = false   # declare that outbound network access is unavailable; prevents futile retries
# [environment.tools]
# go = "/opt/homebrew/bin/go"   # trusted executable path; workspace-local paths are not auto-executed

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # project paths stay in <workspace>; user paths may fall back to <reasonix home>
temperature       = 0.0
# recovery_model = "deepseek-pro"   # optional; falls back to guardian then main model
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
compact_ratio       = 0.8   # sole auto trigger; presets 0.70/0.80/0.85 (default 0.80)
# keep                = ["errors"]   # deprecated compatibility field; ignored at runtime
recent_keep         = 4   # deprecated compatibility field; ignored at runtime
# plan_mode_read_only_commands = ["gh issue view"]   # legacy compatibility only; Plan bash uses Permissions
# legacy_anchor_safety_gate = true   # rollback delete_range to the full-file fresh-read guard
# planner_model = "deepseek-pro"   # optional: enable two-model collaboration
# vision_model = "auto"   # optional: summarize images for text-only models
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# max_subagent_depth = 2   # nested subagent delegation depth; set 1 to disable nested delegation
# max_subagent_concurrency = 6   # session-wide sub-agent concurrency (task/fleet/skills)
# max_parallel_writers = 3   # concurrent writers with non-overlapping write_paths
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[[providers]]
name        = "custom-api-cline-bot"
kind        = "openai"
base_url    = "https://api.cline.bot/api/v1"
models      = ["cline-pass/deepseek-v4-flash", "cline-pass/deepseek-v4-pro"]
default     = "cline-pass/deepseek-v4-flash"
api_key_env = "CUSTOM_API_CLINE_BOT_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
max_output_tokens = 65536   # per-turn total output; 0 = provider auto (official DeepSeek 384K, omit when safe); positive = cost cap; negative = force-omit; never affects compact_ratio
price       = { cache_hit = 0.0028, input = 0.14, output = 0.28, currency = "$" }   # provider-wide fallback, per 1M tokens
prices      = { "cline-pass/deepseek-v4-pro" = { cache_hit = 0, input = 1.32, output = 3.96, currency = "$" } }   # per-model prices, per 1M tokens
billing_currency = "USD"   # frozen list-price currency; independent of display_currency
effort      = "max"

[[providers]]
name        = "custom-opencode-ai"
kind        = "openai"
base_url    = "https://opencode.ai/zen/go/v1"
models      = ["deepseek-v4-flash", "deepseek-v4-pro"]
default     = "deepseek-v4-flash"
api_key_env = "CUSTOM_OPENCODE_AI_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
max_output_tokens = 65536   # per-turn total output; 0 = provider auto (official DeepSeek 384K, omit when safe); positive = cost cap; negative = force-omit; never affects compact_ratio
price       = { cache_hit = 0.0028, input = 0.14, output = 0.28, currency = "$" }   # provider-wide fallback, per 1M tokens
prices      = { "deepseek-v4-pro" = { cache_hit = 0, input = 1.32, output = 3.96, currency = "$" } }   # per-model prices, per 1M tokens
billing_currency = "USD"   # frozen list-price currency; independent of display_currency
billing_mode = "subscription_equivalent"   # payg|subscription_equivalent
effort      = "max"

[[providers]]
name        = "anthropic-api-kimi-com"
kind        = "anthropic"
base_url    = "https://api.kimi.com/coding"
models      = ["k3", "k3-256k", "kimi-for-coding"]
default     = "k3"
api_key_env = "KIMI_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
max_output_tokens = 32768   # per-turn total output; 0 = provider auto (official DeepSeek 384K, omit when safe); positive = cost cap; negative = force-omit; never affects compact_ratio
price       = { cache_hit = 0.3, input = 3, output = 15, currency = "$" }   # provider-wide fallback, per 1M tokens
billing_currency = "USD"   # frozen list-price currency; independent of display_currency
effort      = "max"

[[providers]]
name        = "zai-glm-direct"
kind        = "openai"
base_url    = "https://api.z.ai/api/paas/v4"
models      = ["glm-5.2"]
default     = "glm-5.2"
api_key_env = "ZAI_API_KEY"
context_window = 200000   # tokens; compaction triggers near this limit
max_output_tokens = 65536   # per-turn total output; 0 = provider auto (official DeepSeek 384K, omit when safe); positive = cost cap; negative = force-omit; never affects compact_ratio
price       = { cache_hit = 0.11, input = 0.6, output = 2.2, currency = "$" }   # provider-wide fallback, per 1M tokens
billing_currency = "USD"   # frozen list-price currency; independent of display_currency
reasoning_protocol = "openai"   # auto|deepseek|glm|kimi-k3|openai|none; overrides model/endpoint reasoning detection
supported_efforts = ["low", "medium", "high", "xhigh", "max"]   # custom /effort levels exposed by this provider; overrides the built-in Kind/BaseURL default
default_effort    = "max"   # used when /effort is auto or unset; must be one of supported_efforts

[[providers]]
name        = "minimax-global-anthropic"
kind        = "anthropic"
base_url    = "https://api.minimax.io/anthropic/v1"
models      = ["MiniMax-M3", "MiniMax-M2.7", "MiniMax-M2.7-highspeed"]
default     = "MiniMax-M3"
api_key_env = "MINIMAX_API_KEY"
auth_header = true   # Anthropic-compatible: send Authorization: Bearer <api_key> instead of x-api-key
context_window = 1048576   # tokens; compaction triggers near this limit
# max_output_tokens = 0       # recommended: official DeepSeek omits the field (server 384K ceiling)
# max_output_tokens = 32768   # optional cost cap
# max_output_tokens = 65536   # optional cost cap
# max_output_tokens = 131072  # optional cost cap

[[providers]]
name        = "yolo-auto"
kind        = "openai"
base_url    = "https://yolo-auto.com/v1"
models      = ["deepseek-flash-v4"]
default     = "deepseek-flash-v4"
api_key_env = "YOLO_AUTO_API_KEY"
context_window = 131072   # tokens; compaction triggers near this limit
# max_output_tokens = 0       # recommended: official DeepSeek omits the field (server 384K ceiling)
# max_output_tokens = 32768   # optional cost cap
# max_output_tokens = 65536   # optional cost cap
# max_output_tokens = 131072  # optional cost cap
effort      = "max"

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap
mcp_startup_timeout_seconds = 30   # background initialize + tools/list safety cap; per-plugin overrides may raise it
mcp_call_timeout_seconds = 300   # default MCP call safety cap; per-plugin/tool overrides may raise it

[tools.background_jobs]
stalled_warning_seconds = 900   # heads-up once per background job after this many quiet seconds; a quiet job is not necessarily stuck; 0 disables

[tools.shell]
# prefer = "auto"   # auto|bash|powershell|pwsh; empty/default = auto-detect
# path   = "/opt/homebrew/bin/bash"   # absolute path to the shell executable; empty = PATH lookup

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# disable_implicit_invocation = false   # keep skills available for automatic model invocation
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "Tool" or "Tool(specifier)"; e.g. Bash(go test:*), Edit(src/**).
mode  = "allow"
allow_dynamic_bash = true   # advanced: let mode=allow cover command substitution and interpreter -c/-e
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
# allow = ["Bash(go test:*)", "Bash(git status:*)"]   # never prompted
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" jails each command in an OS sandbox when available;
# without one, bash execution is refused. Empty defaults to enforce on macOS/Linux.
# Windows has no OS-level Bash sandbox and fixes bash = "off".
# network allows sandboxed bash egress.
workspace_root = "${HOME}"
# allow_write = ["/tmp"]          # extra dirs writers may also modify
# forbid_read = []                  # dirs the agent cannot read or list
bash    = "off"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# Bot gateway: multi-channel IM bot for QQ, Feishu/Lark, and WeChat.
[bot]
enabled = false
# model = ""   # empty = default_model
tool_approval_mode = "yolo"   # ask|auto|yolo; yolo skips tool approvals only
max_steps = 25
debounce_ms = 1500
queue_mode = "steer"   # steer|followup|collect|interrupt
queue_cap = 20
queue_drop = "summarize"   # summarize|old|new
ignore_self_messages = true   # ignore bot echo by returned message_id and configured self user ids

[bot.self_user_ids]
qq = []
feishu = []
weixin = []
dingtalk = []

[bot.control]
enabled = false   # local loopback HTTP API for status/send; requires Bearer token
addr = "127.0.0.1:37913"
token_env = "REASONIX_BOT_CONTROL_TOKEN"

[bot.pairing]
enabled = true
request_ttl_minutes = 60
max_pending_per_platform = 3

[bot.allowlist]
enabled = true
allow_all = false
qq_users = []
feishu_users = []
weixin_users = []
dingtalk_users = []
qq_approvers = []
feishu_approvers = []
weixin_approvers = []
dingtalk_approvers = []
qq_admins = []
feishu_admins = []
weixin_admins = []
dingtalk_admins = []
qq_groups = []
feishu_groups = []
weixin_groups = []
dingtalk_groups = []

[bot.qq]
enabled = false
app_id = ""
app_secret_env = "QQ_BOT_APP_SECRET"
sandbox = false

[bot.feishu]
enabled = false
app_id = ""
domain = "feishu"
app_secret_env = "FEISHU_BOT_APP_SECRET"
verification_token = ""
mode = "webhook"
webhook_port = 8080
require_mention = true

[bot.weixin]
enabled = false
account_id = "default"
token_env = "WEIXIN_BOT_TOKEN"
api_base = "https://ilinkai.weixin.qq.com"

[bot.dingtalk]
enabled = false
client_id = ""
client_secret = ""
client_id_env = ""
secret_env = ""
bot_name = ""
require_mention = true

[secrets]   # credential protection; user/global only, ./reasonix.toml cannot override
# filter_subprocess_env = false   # opt-in; stripping tokens breaks gh, HTTPS git push, npm publish
# protect_sensitive_files = false   # opt-in; hiding credential files can break legitimate edit workflows

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
# ${VAR} / ${VAR:-default} are expanded from the environment in command/args/env/url/headers.

[[plugins]]
name    = "linear"
type    = "http"
url     = "https://mcp.linear.app/mcp"
headers = { Authorization = "REDACTED" }
