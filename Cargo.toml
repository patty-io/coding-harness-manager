[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/database",
  "crates/secrets",
  "crates/reconciliation",
  "crates/providers",
  "crates/models-dev",
  "crates/filesystem",
  "crates/harness-sdk",
  "crates/reconciliation",
  "adapters/opencode",
  "adapters/pi",
  "adapters/codex",
  "adapters/claude-code",
  "adapters/reasonix",
  "adapters/detection",
  "adapters",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Patty-Public-1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
wiremock = "0.6"
chm-core = { path = "crates/core" }
chm-database = { path = "crates/database" }
chm-secrets = { path = "crates/secrets" }
chm-reconciliation = { path = "crates/reconciliation" }
chm-providers = { path = "crates/providers" }
chm-models-dev = { path = "crates/models-dev" }
chm-filesystem = { path = "crates/filesystem" }
chm-harness-sdk = { path = "crates/harness-sdk" }
