[package]
name = "coding-harness-manager"
version = "0.1.0"
edition = "2024"

[lib]
name = "coding_harness_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adapters = { path = "../../../adapters" }
chm-core = { path = "../../../crates/core" }
chm-database = { path = "../../../crates/database" }
chm-harness-sdk = { path = "../../../crates/harness-sdk" }
chm-providers = { path = "../../../crates/providers" }
chm-secrets = { path = "../../../crates/secrets" }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"